<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giải Mã Tính Cách Bí Ẩn</title>
    <!-- Thư viện hiệu ứng pháo hoa -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fad0c4 0%, #ffd1ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.65);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.5);
            max-width: 450px;
            width: 90%;
        }
        h1 {
            color: #4a4a4a;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }
        h2 {
            color: #6b6b6b;
            font-size: 1.3rem;
            font-weight: 400;
            margin-bottom: 40px;
        }
        /* Khu vực hiển thị Hộp quà / Kết quả */
        .display-box {
            position: relative;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }
        /* Hiệu ứng Emoji hộp quà to, lắc lư */
        .gift-emoji {
            font-size: 110px;
            cursor: pointer;
            transition: transform 0.2s;
            animation: shake 1.5s infinite ease-in-out;
        }
        @keyframes shake {
            0% { transform: rotate(0deg) scale(1); }
            10% { transform: rotate(-8deg) scale(1.05); }
            20% { transform: rotate(8deg) scale(1.05); }
            30% { transform: rotate(-6deg) scale(1.05); }
            40% { transform: rotate(6deg) scale(1.05); }
            50% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(0deg) scale(1); }
        }
        /* Hiệu ứng chữ đáp án khi hiện ra */
        .result-box {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .result-emoji {
            font-size: 90px;
            margin-bottom: 10px;
        }
        .result-text {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        /* Nút bấm */
        .action-btn {
            background: linear-gradient(135deg, #ff6b81 0%, #ff4757 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 107, 129, 0.4);
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 129, 0.5);
        }
        .action-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BẠN NGHĨ MÌNH NHƯ THẾ NÀO?</h1>
    <h2>TÔI NGHĨ BẠN...</h2>

    <div class="display-box">
        <!-- Hộp quà mặc định ban đầu -->
        <div class="gift-emoji" id="giftBox">🎁</div>
        
        <!-- Khu vực hiển thị kết quả ẩn ẩn đi lúc đầu -->
        <div class="result-box" id="resultCard">
            <div class="result-emoji" id="resEmoji">🥰</div>
            <div class="result-text" id="resText">CUTE</div>
        </div>
    </div>

    <button class="action-btn" id="actionBtn">MỞ HỘP QUÀ</button>
</div>

<script>
    const giftBox = document.getElementById('giftBox');
    const resultCard = document.getElementById('resultCard');
    const resEmoji = document.getElementById('resEmoji');
    const resText = document.getElementById('resText');
    const actionBtn = document.getElementById('actionBtn');

    // Cấu hình các đáp án, màu chữ và tỷ lệ xác suất thực tế
    const answers = [
        { text: "CUTE", emoji: "🥰", color: "#ff6b81", weight: 35 },
        { text: "TĂNG ĐỘNG", emoji: "⚡", color: "#ffa502", weight: 30 },
        { text: "NGHỊCH", emoji: "🐒", color: "#2ed573", weight: 20 },
        { text: "DỞ HƠI", emoji: "🤪", color: "#1e90ff", weight: 15 }
    ];

    // Sử dụng biến để kiểm tra xem có phải lượt bấm đầu tiên không
    let isFirstTurn = true;
    let isOpen = false;

    // Thuật toán bốc ngẫu nhiên dựa trên phần trăm ở các lượt sau
    function getRandomAnswer() {
        const rand = Math.random() * 100;
        let cumulative = 0;
        for (let i = 0; i < answers.length; i++) {
            cumulative += answers[i].weight;
            if (rand <= cumulative) return answers[i];
        }
        return answers[0];
    }

    function handleOpen() {
        if (isOpen) {
            // Nếu đang mở mà bấm lại thì đóng hộp để chơi lượt mới
            isOpen = false;
            giftBox.style.display = 'block';
            resultCard.style.display = 'none';
            actionBtn.innerText = 'MỞ HỘP QUÀ';
            actionBtn.style.background = 'linear-gradient(135deg, #ff6b81 0%, #ff4757 100%)';
            actionBtn.style.boxShadow = '0 8px 15px rgba(255, 107, 129, 0.4)';
        } else {
            // Xử lý mở quà
            isOpen = true;
            let finalAns;

            if (isFirstTurn) {
                // Đảm bảo lượt đầu tiên bắt buộc phải là CUTE
                finalAns = answers[0]; 
                isFirstTurn = false; // Tắt chế độ lượt đầu
            } else {
                // Các lượt tiếp theo tính toán công bằng theo % tỷ lệ
                finalAns = getRandomAnswer();
            }

            // Gán dữ liệu đáp án vào giao diện
            resText.innerText = finalAns.text;
            resText.style.color = finalAns.color;
            resEmoji.innerText = finalAns.emoji;

            // Ẩn hộp quà, hiện hình ảnh chữ đáp án ra
            giftBox.style.display = 'none';
            resultCard.style.display = 'flex';
            
            // Đổi nút bấm thành Chơi lại
            actionBtn.innerText = 'THỬ LẠI LƯỢT KHÁC';
            actionBtn.style.background = 'linear-gradient(135deg, #2f3640 0%, #718093 100%)';
            actionBtn.style.boxShadow = '0 8px 15px rgba(0,0,0,0.15)';

            // Bắn pháo hoa ăn mừng cực mạnh
            confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
        }
    }

    // Bấm nút hoặc bấm thẳng vào hộp quà đều được
    actionBtn.addEventListener('click', handleOpen);
    giftBox.addEventListener('click', handleOpen);
</script>

</body>
</html>
