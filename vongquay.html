<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay Tính Cách Tâm Linh</title>
    <!-- Thư viện pháo hoa cao cấp -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #fbc531 0%, #718093 100%);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }
        h2 {
            font-size: 1.4rem;
            font-weight: 400;
            margin-bottom: 35px;
            color: #f5f6fa;
            opacity: 0.9;
        }
        .wheel-box {
            position: relative;
            width: 380px;
            height: 380px;
            margin: 0 auto;
        }
        /* Kim chỉ hướng thiết kế 3D sắc nét đặt ở đỉnh 12h */
        .pointer-3d {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 32px solid #ea2027;
            z-index: 20;
            filter: drop-shadow(0px 6px 6px rgba(0,0,0,0.4));
        }
        /* Canvas vẽ vòng quay tròn trịa */
        canvas {
            display: block;
            border-radius: 50%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            border: 6px solid #fff;
            background: #fff;
        }
        /* Nút quay hiệu ứng gương bóng bẩy */
        .spin-trigger {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: #ffffff;
            color: #2f3640;
            border-radius: 50%;
            border: none;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4), inset 0 -3px 0 #dcdde1;
            z-index: 10;
            transition: all 0.15s ease;
            letter-spacing: 0.5px;
        }
        .spin-trigger:hover {
            background: #f5f6fa;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .spin-trigger:active {
            transform: translate(-50%, -50%) scale(0.92);
        }
        .spin-trigger:disabled {
            background: #bdc5cd;
            color: #7f8c8d;
            cursor: not-allowed;
            box-shadow: none;
        }
        /* Hộp hiển thị kết quả hoạt họa */
        .result-display {
            margin-top: 35px;
            font-size: 1.8rem;
            font-weight: 700;
            min-height: 50px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .pulse {
            animation: pulseAnim 1s infinite alternate;
        }
        @keyframes pulseAnim {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BẠN NGHĨ MÌNH NHƯ THẾ NÀO?</h1>
    <h2>TÔI NGHĨ BẠN...</h2>

    <div class="wheel-box">
        <div class="pointer-3d"></div>
        <canvas id="wheelCanvas" width="368" height="368"></canvas>
        <button class="spin-trigger" id="spinBtn">QUAY</button>
    </div>

    <div class="result-display" id="resultLabel">🎯 Bấm nút để giải mã!</div>
</div>

<script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const resultLabel = document.getElementById('resultLabel');

    // Cấu hình dữ liệu chuẩn tỷ lệ phần trăm theo yêu cầu
    const items = [
        { text: "CUTE 🥰", color: "#ff6b81", weight: 35 },
        { text: "TĂNG ĐỘNG ⚡", color: "#ffa502", weight: 30 },
        { text: "NGHỊCH 🐒", color: "#2ed573", weight: 20 },
        { text: "DỞ HƠI 🤪", color: "#1e90ff", weight: 15 }
    ];

    const totalWeight = 100;
    const center = canvas.width / 2;
    const radius = canvas.width / 2;

    // Giả lập âm thanh cơ học (Web Audio API) để tạo hiệu ứng tích tắc khi quay qua các ô
    function playTickSound() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    // Tính toán góc (độ Radian) cho từng ô dựa trên phần trăm diện tích
    let startAngles = [];
    let currentAngle = 0;
    for (let i = 0; i < items.length; i++) {
        startAngles.push(currentAngle);
        // Đổi từ tỷ lệ % sang góc Radian (360 độ = 2 * Math.PI)
        currentAngle += (items[i].weight / totalWeight) * (2 * Math.PI);
    }

    // Vẽ vòng quay lên Canvas
    function drawWheel(currentRotation = 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        for (let i = 0; i < items.length; i++) {
            const startAngle = startAngles[i] + currentRotation;
            const endAngle = (i === items.length - 1 ? startAngles[0] + 2 * Math.PI : startAngles[i+1]) + currentRotation;
            
            // Vẽ nan quạt miếng bánh
            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.arc(center, center, radius, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = items[i].color;
            ctx.fill();
            
            // Vẽ đường viền trắng tinh tế chia cách các ô
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            // Tính toán viết chữ căn giữa nan quạt chuẩn xác tuyệt đối
            ctx.save();
            ctx.translate(center, center);
            const middleAngle = startAngle + (endAngle - startAngle) / 2;
            ctx.rotate(middleAngle);
            
            // Thiết lập phong cách chữ sắc nét
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 16px 'Montserrat', sans-serif";
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
            ctx.shadowBlur = 4;
            
            // Đẩy chữ ra rìa vòng quay vừa vặn, không bị dính vào tâm hay mép ngoài
            ctx.fillText(items[i].text, radius - 25, 0);
            ctx.restore();
        }

        // Vẽ một vòng tròn nhỏ trang trí ở tâm
        ctx.beginPath();
        ctx.arc(center, center, 44, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
    }

    // Khởi tạo vòng quay ban đầu ở trạng thái tĩnh
    drawWheel(0);

    let isSpinning = false;

    // Chọn phần thưởng ngẫu nhiên theo trọng số xác suất (%)
    function pickRewardByProbability() {
        const rand = Math.random() * 100;
        let cumulative = 0;
        for (let i = 0; i < items.length; i++) {
            cumulative += items[i].weight;
            if (rand <= cumulative) return i;
        }
        return 0;
    }

    spinBtn.addEventListener('click', () => {
        if (isSpinning) return;
        isSpinning = true;

        // Reset trạng thái hiển thị
        resultLabel.classList.remove('pulse');
        resultLabel.style.color = '#fff';
        resultLabel.innerText = "🔮 Đang thấu thị tính cách...";
        spinBtn.disabled = true;

        const targetIndex = pickRewardByProbability();
        const selected = items[targetIndex];

        // Tìm điểm giữa (theo radian) của ô mục tiêu
        const nextIdx = (targetIndex === items.length - 1) ? 0 : targetIndex + 1;
        const targetStart = startAngles[targetIndex];
        let targetEnd = (targetIndex === items.length - 1) ? 2 * Math.PI : startAngles[nextIdx];
        const midSegment = targetStart + (targetEnd - targetStart) / 2;

        // Vị trí kim chỉ ở hướng 12 giờ chuẩn tương ứng góc 1.5 * Math.PI góc radian trong hệ tọa độ canvas
        // Cần tính toán góc quay sao cho ô mục tiêu nằm ngay dưới mũi kim khi dừng
        const stopAngle = (1.5 * Math.PI) - midSegment;
        
        // Tạo số vòng quay quán tính lớn (từ 6 đến 8 vòng) để tạo hiệu ứng xoay nhanh kịch tính
        const totalRotationTarget = (Math.PI * 2 * (6 + Math.floor(Math.random() * 3))) + stopAngle;

        let startTime = null;
        const duration = 5000; // Thời gian quay kéo dài hẳn 5 giây tạo hiệu ứng hồi hộp
        let lastTickAngle = 0;

        function animateWheel(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const progress = Math.min(elapsed / duration, 1);
